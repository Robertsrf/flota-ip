<!doctype html>
<html lang="es-VE">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%iconos/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f5b3f" />
    <meta name="description" content="Rutas, combustible y mantenimiento de la flota de Distribuidora y Suministros IP" />
    <meta name="robots" content="noindex" />
    <title>Flota IP</title>
    <script>
      // Aplica el tema antes de pintar para evitar un destello
      (function () {
        try {
          var t = localStorage.getItem('flota-tema');
          var oscuro = t === 'oscuro' || (t !== 'claro' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (oscuro) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
